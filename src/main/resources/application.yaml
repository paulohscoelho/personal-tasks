spring:
  application:
    name: personal-tasks
  datasource:
    url: jdbc:h2:mem:personal_tasks_db
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
# Formato padrão para leitura e escrita de datas em formato de texto no JSON

  jackson:
    date-format: "yyyy-MM-dd HH:mm:ss"
    time-zone: "America/Sao_Paulo"


  main:
    banner-mode: off

